name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: [self-hosted, Linux, X64, moderneer-site]
    timeout-minutes: 10
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Secret scan
        run: node tools/quality/scan-secrets.mjs

      - name: Repository hygiene
        run: node tools/quality/check-hygiene.mjs

      - name: Quality tool tests
        run: node --test "tools/quality/*.test.mjs"

      - name: HTML, metadata, links, assets and accessibility
        run: node tools/quality/check-site.mjs

      - name: HTTP smoke check
        run: node tools/quality/smoke-site.mjs

  deploy:
    name: deploy
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, moderneer-site]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # The upload below takes the whole tree. Quality tooling stays out of the public site; see docs/quality/README.md.
      - name: Remove quality tooling from the published tree
        run: rm -rf tools docs design .githooks .gitattributes .gitignore .quality-allow.json .secret-scan-allow.json

      # Owner decision 2026-11-02: no Markdown file is ever published. The check fails the deploy if the removal ever misses one.
      - name: Remove Markdown from the published tree
        run: |
          find . -path ./.git -prune -o -type f -iname '*.md' -exec rm -f {} +
          if [ -n "$(find . -path ./.git -prune -o -type f -iname '*.md' -print)" ]; then echo "::error::Markdown would be published"; exit 1; fi

      # Everything that would publish, by path and type. A file that is not on this list stops the deploy.
      - name: Only approved files publish
        run: |
          find . \( -path ./.git -o -path ./.github \) -prune -o -type f -print > "$RUNNER_TEMP/published.txt"
          if grep -v -i -E '^\./((index|telos|404)\.html|CNAME|COPYRIGHT|LICENSE|robots\.txt|sitemap\.xml|\.nojekyll|assets/[a-z0-9/_-]+(\.[a-z0-9_-]+)?\.(css|js|svg|png|jpe?g|webp|ico|woff2?))$' "$RUNNER_TEMP/published.txt"; then echo "::error::The files above are not approved for publication"; exit 1; fi
          test -f LICENSE

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
